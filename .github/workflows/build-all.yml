name: Build all platforms

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          KS="$RUNNER_TEMP/gabgo-release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            PW="$KEYSTORE_PASSWORD"; ALIAS="${KEY_ALIAS:-gabgo}"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret – signing with a keystore generated for this run."
            PW="$(openssl rand -hex 16)"; ALIAS=gabgo
            echo "::add-mask::$PW"
            keytool -genkeypair -noprompt -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" \
              -dname "CN=GabGo, O=Gabbas, C=DE"
          fi
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS" "$PW" "$ALIAS" "$PW" > keystore.properties
      - run: ./gradlew :composeApp:assembleDebug :composeApp:assembleRelease
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp composeApp/build/outputs/apk/release/composeApp-release.apk dist/GabGo-Android.apk
          cp composeApp/build/outputs/apk/debug/composeApp-debug.apk dist/GabGo-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GabGo-Android.apk
          path: dist/GabGo-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GabGo-Android-debug.apk
          path: dist/GabGo-Android-debug.apk

  windows:
    name: Windows (MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: .\gradlew.bat :composeApp:packageMsi
      - uses: actions/upload-artifact@v4
        with:
          name: GabGo-Windows.msi
          path: composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :composeApp:packageDmg
      - uses: actions/upload-artifact@v4
        with:
          name: GabGo-macOS.dmg
          path: composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  ios:
    name: iOS (Xcode build)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: xcodebuild (iOS Simulator, no signing)
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug \
            -sdk iphonesimulator ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Zip Xcode project
        run: zip -qr GabGo-iOS-XcodeProject.zip iosApp -x 'iosApp/build/*' '*/xcuserdata/*'
      - uses: actions/upload-artifact@v4
        with:
          name: GabGo-iOS-XcodeProject.zip
          path: GabGo-iOS-XcodeProject.zip

  release:
    name: GitHub Release (tags v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
