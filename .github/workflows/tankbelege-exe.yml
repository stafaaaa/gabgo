name: Tankbelege Windows-EXE

on:
  push:
    paths:
      - "Tankbelege/**"
      - ".github/workflows/tankbelege-exe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Tankbelege
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q tests
      - run: pyinstaller --noconfirm --onefile --windowed --name Tankbelege tankbelege_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tankbelege-Windows
          path: |
            Tankbelege/dist/Tankbelege.exe
            Tankbelege/start.bat
            Tankbelege/README.md
